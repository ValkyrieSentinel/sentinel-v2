[package]
name = "sentinel-core"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = "0.6"
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls"] }
clickhouse = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
anyhow = "1.0"
tower-http = { version = "0.4", features = ["cors"] }
aya = { version = "0.11", features = ["async_tokio"] }
